<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
     <model-viewer id="wolken" src="./Wolken/Wolken_zusammengefüg.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1" camera-orbit="Odeg 75deg 25%">
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="ohneHintergrundHaus+Pilz.glb" id="vordergrund" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1" animation-name="SurfSphere.001Action.002" autoplay>
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
      <button
        class="hotspot-pilz"
        slot="hotspot-pilz"
        data-position="5.44 3.39 -0.89">
      </button>
      <img src="Sprechblase.png" data-position="10.5 6.5 -1" alt="Herzlich willkommen auf meiner Website" class="sprechblase" slot="hotspot-pilz-text">
    </model-viewer>  
    <div id="überschriften">
        <a href="./index.html">
            <p>Home</p>
        </a>
        <a href="./animation.html">
        <p> Animation</p>
        </a>
        <a href="./aboutme.html">
        <p>About me</p>
        </a>
    </div>

    
    <script src="./script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  </body>
</html>
